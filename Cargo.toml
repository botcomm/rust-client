[package]
name = "botcomm"
version = "0.20261125.1"
edition = "2021"
description = "Rust SDK for building BotComm bots"
license = "MIT"
repository = "https://github.com/botcomm/rust-client"
keywords = ["botcomm", "bot", "chat"]
categories = ["api-bindings"]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal"] }

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
